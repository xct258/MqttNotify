name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag，例如 v2.0.3'
        required: true
        type: string
      publish_release:
        description: '是否发布 GitHub Release（关闭时只构建并保留 Actions artifacts）'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows build
    uses: ./.github/workflows/build-windows.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  android:
    name: Android build
    uses: ./.github/workflows/build-android.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [windows, android]
    if: github.event_name == 'push' || inputs.publish_release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.exe *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: MqttNotify ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/MqttNotify-Windows-x64.exe
            release/MqttNotify-Windows-x64-self-contained.exe
            release/MqttNotify-Android-*.apk
            release/SHA256SUMS.txt
