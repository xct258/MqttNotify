name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag，例如 v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          # 缓存 NuGet 包；csproj / Directory.Build.props 变化时自动换 key
          cache: true
          cache-dependency-path: |
            windows-client/**/*.csproj
            windows-client/Directory.Build.props

      - name: Test
        shell: pwsh
        run: dotnet test windows-client/tests/MqttNotify.Core.Tests -c Release

      - name: Publish framework-dependent
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag.TrimStart('v')
          dotnet publish windows-client/src/MqttNotify.Windows -c Release -r win-x64 `
            --self-contained false -p:PublishSingleFile=true -p:Version=$version `
            -o "$env:RUNNER_TEMP\win-fd"
          New-Item -ItemType Directory -Force -Path windows-client/artifacts | Out-Null
          Copy-Item "$env:RUNNER_TEMP\win-fd\MqttNotify.exe" `
            windows-client/artifacts/MqttNotify-Windows-x64.exe

      - name: Publish self-contained
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag.TrimStart('v')
          dotnet publish windows-client/src/MqttNotify.Windows -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:Version=$version `
            -o "$env:RUNNER_TEMP\win-sc"
          Copy-Item "$env:RUNNER_TEMP\win-sc\MqttNotify.exe" `
            windows-client/artifacts/MqttNotify-Windows-x64-self-contained.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows-client/artifacts/*.exe
          if-no-files-found: error

  android:
    name: Android build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p android-client/keystore
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-client/keystore/release.jks
            cat > android-client/keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "Android signing configured"
          else
            echo "No Android signing secrets; falling back to debug APK"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          # GitHub 的 ubuntu-latest 已预装 SDK；只在缺包时安装，避免每次跑 sdkmanager。
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "找不到 sdkmanager，ANDROID_HOME=${ANDROID_HOME:-未设置}" >&2
            exit 1
          fi
          if [ -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-34" ] &&
             [ -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/34.0.0" ]; then
            echo "Android SDK 34 / build-tools 34.0.0 已预装"
          else
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build APK
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ -f keystore.properties ]; then
            gradle :app:testDebugUnitTest :app:assembleRelease \
              -PappVersionName="$VERSION" \
              -PappVersionCode="${GITHUB_RUN_NUMBER}"
          else
            gradle :app:testDebugUnitTest :app:assembleDebug \
              -PappVersionName="$VERSION" \
              -PappVersionCode="${GITHUB_RUN_NUMBER}"
          fi
        working-directory: android-client

      - name: Collect APK
        run: |
          mkdir -p android-client/artifacts
          if [ -f android-client/keystore.properties ]; then
            cp android-client/app/build/outputs/apk/release/app-release.apk \
              android-client/artifacts/MqttNotify-Android-release.apk
          else
            cp android-client/app/build/outputs/apk/debug/app-debug.apk \
              android-client/artifacts/MqttNotify-Android-debug.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android-client/artifacts/MqttNotify-Android-*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [windows, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.exe *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: MqttNotify ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/MqttNotify-Windows-x64.exe
            release/MqttNotify-Windows-x64-self-contained.exe
            release/MqttNotify-Android-*.apk
            release/SHA256SUMS.txt
